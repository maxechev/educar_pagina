name: Calidad de código

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: Linter Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar Ruff
        run: python -m pip install ruff==0.17.2
      - name: Analizar el proyecto Django
        run: ruff check educar_pagina_proyecto

  django-check:
    name: Django system check
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-production-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Verificar configuración Django
        working-directory: educar_pagina_proyecto
        run: python manage.py check
      - name: Ejecutar pruebas unitarias de Django
        working-directory: educar_pagina_proyecto
        run: python manage.py test core --verbosity 2
